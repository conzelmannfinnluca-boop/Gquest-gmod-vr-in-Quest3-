plugins { id 'com.android.application' version '8.1.4' }
android {
    namespace 'org.codex.gmodquest.bootstrap'
    compileSdk 34
    ndkVersion '23.2.8568313'
    defaultConfig {
        applicationId 'org.codex.gmodquest.bootstrap'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1-diagnostic'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; jniLibs.srcDirs = ['libs'] } }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
}
