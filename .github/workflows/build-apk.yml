name: Gquest APK

# Builds the signed Gquest APK on a GitHub runner.
#
# Everything the build needs is either public (base APK, NDK 23.2, build-tools
# 34, JDK, Rust, liblua5.4) or private: work/quest-vr-content (+manifest), the
# weapon model scripts, the private server Lua files and work/gdroid130-compat.
# The private part comes either from the release asset named below or already
# committed in the repo (private repo / private build folder).
# See docs/Gquest-GitHub-Build.md for what to upload and how.
#
# Laeuft manuell (Actions -> Gquest APK -> Run workflow) und bei einem Tag
# v* - dann haengt der Job "release" das signierte APK an das Release des Tags.
#
# Achtung: "Re-run jobs" wiederholt den ALTEN Commit samt altem Workflow. Nach
# einer Aenderung an dieser Datei immer "Run workflow" auf dem aktuellen
# Branch starten.

on:
  workflow_dispatch:
  # Jeder Push auf main baut, damit niemand einen alten Lauf wiederholen muss.
  # Soll das nicht jeder Push tun, diesen Block auf workflow_dispatch + tags
  # reduzieren.
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: gquest-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  INPUTS_RELEASE: inputs-latest
  INPUTS_ASSET: gquest-private-inputs.tar.gz
  BASE_APK_URL: https://github.com/tinsarfal/GDroid/releases/download/0.1.30/GDroid-0.1.30.apk
  BASE_APK_SHA256: 28bcce6d656f324b883fa638ceae2893cfa875e423f28a7fbc2329c5cdd5d13c
  NDK_URL: https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
  BUILD_TOOLS_URL: https://dl.google.com/android/repository/build-tools_r34-linux.zip
  # Gepinnt, damit der Cache-Key eindeutig bleibt. Beim Anheben den Key
  # GQUEST_TOOLS_CACHE unten mitziehen.
  RUST_VERSION: 1.83.0
  GQUEST_TOOLS_CACHE: gquest-tools-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # lfs: private Inhalte mit grossen Texturen koennen als Git-LFS-Objekte
      # vorliegen; ohne das waeren sie im Build nur Pointer-Dateien.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Freier Speicher
        run: df -h /

      # NDK, build-tools und Rust aendern sich nicht zwischen Laeufen; nur der
      # Key bestimmt, wann neu geladen wird. Aendert sich eine Version oder URL,
      # GQUEST_TOOLS_CACHE erhoehen (Caches sind unveraenderlich).
      - name: Cache fuer NDK, build-tools und Rust
        uses: actions/cache@v6
        with:
          path: |
            work/android-sdk
            work/toolchains/cargo
            work/toolchains/rustup
          key: ${{ env.GQUEST_TOOLS_CACHE }}-ndk23.2.8568313-bt34.0.0-rust${{ env.RUST_VERSION }}-${{ runner.os }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: JDK in den erwarteten Pfad legen
        run: |
          set -euo pipefail
          mkdir -p work/toolchains
          ln -sfn "$JAVA_HOME" work/toolchains/jdk
          work/toolchains/jdk/bin/java -version

      - name: Host-Werkzeuge fuer die Tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ liblua5.4-0
          c++ --version | head -n1
          python3 -c "import ctypes; ctypes.CDLL('liblua5.4.so.0'); print('liblua5.4.so.0 vorhanden')"

      - name: NDK 23.2.8568313
        run: |
          set -euo pipefail
          ndk=work/android-sdk/ndk/23.2.8568313
          clangxx="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          if [ -x "$clangxx" ]; then
            echo "NDK aus dem Cache: $ndk"
          else
            mkdir -p work/android-sdk/ndk
            curl -sSL --retry 3 -o /tmp/ndk.zip "$NDK_URL"
            unzip -q /tmp/ndk.zip -d /tmp/ndk-unpack
            top="$(find /tmp/ndk-unpack -maxdepth 1 -mindepth 1 -type d | head -n1)"
            test -n "$top"
            rm -rf "$ndk"
            mv "$top" "$ndk"
            rm -rf /tmp/ndk.zip /tmp/ndk-unpack
          fi
          "$clangxx" --version | head -n1

      - name: build-tools 34.0.0
        run: |
          set -euo pipefail
          tools=work/android-sdk/build-tools/34.0.0
          if [ -f "$tools/lib/apksigner.jar" ] && [ -f "$tools/zipalign" ]; then
            echo "build-tools aus dem Cache: $tools"
          else
            mkdir -p "$tools"
            curl -sSL --retry 3 -o /tmp/bt.zip "$BUILD_TOOLS_URL"
            unzip -q /tmp/bt.zip -d /tmp/bt-unpack
            top="$(find /tmp/bt-unpack -maxdepth 1 -mindepth 1 -type d | head -n1)"
            test -n "$top"
            cp -a "$top"/. "$tools/"
            chmod +x "$tools/zipalign"
            rm -rf /tmp/bt.zip /tmp/bt-unpack
          fi
          test -f "$tools/zipalign"
          test -f "$tools/lib/apksigner.jar"

      - name: Private Rust-Toolchain in den erwarteten Pfaden
        run: |
          set -euo pipefail
          export CARGO_HOME="$PWD/work/toolchains/cargo"
          export RUSTUP_HOME="$PWD/work/toolchains/rustup"
          if [ -x "$CARGO_HOME/bin/rustup" ]; then
            echo "Rust aus dem Cache: $("$CARGO_HOME/bin/rustc" --version)"
          else
            curl -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$RUST_VERSION" --no-modify-path
          fi
          "$CARGO_HOME/bin/rustup" target add aarch64-linux-android
          "$CARGO_HOME/bin/cargo" --version

      - name: Basis-APK laden, pruefen und native Bibliotheken entpacken
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o outputs/GDroid-0.1.30.apk "$BASE_APK_URL"
          echo "$BASE_APK_SHA256  outputs/GDroid-0.1.30.apk" | sha256sum -c -
          python3 work/unpack_base_natives.py

      # Mit gesetzten Secrets signiert der Job mit deinem Release-Schluessel:
      # gleiche Signatur in jedem Lauf, Updates per "adb install -r" moeglich.
      # Ohne Secrets signiert er mit einem Wegwerf-Debug-Key und warnt - das APK
      # ist installierbar, aber nicht updatefaehig. Halbe Konfiguration bricht ab.
      - name: Signaturschluessel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.GQUEST_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.GQUEST_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.GQUEST_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.GQUEST_KEY_ALIAS }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          chmod 700 "$dir"
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASS:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$dir/gquest-release.jks"
            keytool -list -keystore "$dir/gquest-release.jks" -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" > /dev/null
            keystore="$dir/gquest-release.jks"
            alias="$KEY_ALIAS"
            store_pass="$KEYSTORE_PASS"
            key_pass="${KEY_PASS:-$KEYSTORE_PASS}"
            echo "Signatur: Release-Schluessel aus den Secrets (Alias $alias)."
          elif [ -z "${KEYSTORE_B64:-}${KEYSTORE_PASS:-}${KEY_ALIAS:-}" ]; then
            keytool -genkeypair -keystore "$dir/debug.jks" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            keystore="$dir/debug.jks"
            alias=androiddebugkey
            store_pass=android
            key_pass=android
            echo "::warning::Keine Signatur-Secrets gesetzt - dieses APK ist mit einem Wegwerf-Debug-Key signiert und kann eine bestehende Installation NICHT aktualisieren."
            {
              echo "## APK nur debug-signiert"
              echo
              echo "Ohne \`GQUEST_KEYSTORE_B64\`, \`GQUEST_KEYSTORE_PASS\` und \`GQUEST_KEY_ALIAS\` signiert der Job mit einem bei jedem Lauf neu erzeugten Debug-Key."
              echo "Das APK installiert auf einem Geraet ohne bestehende GQuest-Installation, aber nicht als Update darueber."
              echo "Fuer updatefaehige Builds die drei Secrets anlegen (docs/Gquest-GitHub-Build.md, Abschnitt 3b)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Signatur-Secrets unvollstaendig - entweder GQUEST_KEYSTORE_B64, GQUEST_KEYSTORE_PASS und GQUEST_KEY_ALIAS alle setzen oder alle weglassen."
            exit 1
          fi
          expected="$(keytool -list -v -keystore "$keystore" -storepass "$store_pass" -alias "$alias" \
            | grep -i 'SHA256:' | head -n1 | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')"
          if [ -z "$expected" ]; then
            echo "::error::Kein Signaturzertifikat im Keystore gefunden (Alias $alias)."
            exit 1
          fi
          echo "Signaturzertifikat: SHA256 ${expected:0:16}..."
          {
            echo "GQUEST_KEYSTORE=$keystore"
            echo "GQUEST_EXPECTED_SIGNER=$expected"
            echo "GQUEST_KEY_ALIAS=$alias"
            echo "GQUEST_KEYSTORE_PASS=$store_pass"
            echo "GQUEST_KEY_PASS=$key_pass"
          } >> "$GITHUB_ENV"

      # Zwei Wege, die privaten Eingaben bereitzustellen:
      # 1. Release "inputs-latest" mit dem Archiv (oeffentliches Repo), oder
      # 2. die Dateien liegen ohnehin im Repo (privates Repo / privater Build-Ordner).
      - name: Private Build-Eingaben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$INPUTS_RELEASE" >/dev/null 2>&1; then
            gh release download "$INPUTS_RELEASE" --pattern "$INPUTS_ASSET" --dir /tmp --clobber
            tar -xzf "/tmp/$INPUTS_ASSET" -C .
            rm -f "/tmp/$INPUTS_ASSET"
            echo "Private Eingaben aus Release $INPUTS_RELEASE entpackt."
          elif [ -d work/quest-vr-content ]; then
            echo "Kein Release $INPUTS_RELEASE - die privaten Eingaben liegen bereits im Repo."
          else
            echo "::error::Weder Release $INPUTS_RELEASE noch work/quest-vr-content vorhanden - die privaten Build-Eingaben fehlen."
            echo "Archiv hochladen (docs/Gquest-GitHub-Build.md) oder die privaten Dateien"
            echo "ins Repo legen. Danach den Workflow neu starten."
            {
              echo "## Private Build-Eingaben fehlen"
              echo
              echo "Weder das Release \`$INPUTS_RELEASE\` mit \`$INPUTS_ASSET\` noch \`work/quest-vr-content\` sind vorhanden."
              echo "Benoetigt: \`work/quest-vr-content\` + Manifest, \`work/gquest-weapon-models/content\`, \`work/gdroid130-compat/audit.json\` und die drei privaten Lua-Dateien."
              echo "Anleitung: \`docs/Gquest-GitHub-Build.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Vorabpruefung der Build-Eingaben
        run: |
          set -o pipefail
          if python3 work/check_gquest_build.py | tee /tmp/preflight.log; then
            exit 0
          fi
          {
            echo "## Vorabpruefung fehlgeschlagen"
            echo
            echo '```'
            grep -E '^(FEHLT|   [0-9]+\.)' /tmp/preflight.log | head -n 40
            echo '```'
            echo "Die vollstaendige Liste mit Abhilfe steht im Log dieses Schritts."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: APK bauen
        run: |
          set -euo pipefail
          BUILD_SCRIPT=""
          for candidate in Gquest-Hybrid/tools/build.py Gquest/tools/build.py; do
            if [ -f "$candidate" ]; then BUILD_SCRIPT="$candidate"; break; fi
          done
          if [ -z "$BUILD_SCRIPT" ]; then
            echo "Kein Build-Einstieg gefunden (Gquest-Hybrid/tools/build.py oder Gquest/tools/build.py)"
            exit 1
          fi
          echo "Build-Einstieg: $BUILD_SCRIPT"
          python3 "$BUILD_SCRIPT"

      - name: Nachweise
        run: |
          set -euo pipefail
          ls -l work/Gquest.apk outputs/Gquest.apk
          sha256sum work/Gquest.apk
          "$JAVA_HOME/bin/java" -jar work/android-sdk/build-tools/34.0.0/lib/apksigner.jar \
            verify --print-certs work/Gquest.apk | head -n5

      # Ein APK mit fremdem Schluessel waere installierbar, aber nicht updatefaehig.
      - name: Signatur des Artefakts pruefen
        run: python3 work/check_apk_signer.py work/Gquest.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Gquest-apk
          if-no-files-found: error
          path: |
            work/Gquest.apk
            outputs/Gquest-build-verification.json
            Gquest/dist/verification.json

      - name: Signaturschluessel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

  # Eigener Job, weil das Anlegen eines Releases contents: write braucht - der
  # Build selbst bleibt bei contents: read.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Gquest-apk
          path: dist

      - name: Release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist/work/Gquest.apk
          (cd dist/work && sha256sum Gquest.apk > ../Gquest.apk.sha256)
          cat dist/Gquest.apk.sha256
          assets=(dist/work/Gquest.apk dist/Gquest.apk.sha256)
          for extra in dist/outputs/Gquest-build-verification.json dist/Gquest/dist/verification.json; do
            if [ -f "$extra" ]; then assets+=("$extra"); fi
          done
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG existiert - Assets werden ersetzt."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Gquest $TAG" \
              --notes "Automatisch gebaut aus ${GITHUB_SHA}. Signatur-Fingerabdruck steht im Build-Log." \
              --verify-tag
          fi
